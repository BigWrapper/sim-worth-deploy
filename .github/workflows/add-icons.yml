name: Add Luxury Icons
on: workflow_dispatch
jobs:
  icons:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate luxury icons
        run: |
          pip install Pillow
          python3 << 'PY'
          from PIL import Image, ImageDraw, ImageFont
          import os

          # Create luxury black + gold S with crown
          def make_icon(size):
              img = Image.new('RGBA', (size, size), (10,10,10,255))
              draw = ImageDraw.Draw(img)
              # Gold color
              gold = (212,175,55,255)
              # Simple S
              try:
                  # Try to use big font
                  font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf", int(size*0.6))
              except:
                  font = ImageFont.load_default()
              # Draw S centered
              draw.text((size//2, size//2), "S", fill=gold, font=font, anchor="mm")
              # Tiny crown as text above
              draw.text((size//2, int(size*0.25)), "♛", fill=gold, anchor="mm")
              return img

          sizes = {
              "mipmap-mdpi":48,
              "mipmap-hdpi":72,
              "mipmap-xhdpi":96,
              "mipmap-xxhdpi":144,
              "mipmap-xxxhdpi":192
          }
          
          for folder, sz in sizes.items():
              path = f"android/app/src/main/res/{folder}"
              os.makedirs(path, exist_ok=True)
              icon = make_icon(sz)
              icon.save(f"{path}/ic_launcher.png")
              icon.save(f"{path}/ic_launcher_round.png")
              icon.save(f"{path}/ic_launcher_foreground.png")
              print(f"Created {folder}")

          # drawable splash - big luxury
          d_path = "android/app/src/main/res/drawable"
          os.makedirs(d_path, exist_ok=True)
          splash = Image.new('RGBA', (512,512), (10,10,10,255))
          draw = ImageDraw.Draw(splash)
          try:
              font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf", 300)
          except:
              font = ImageFont.load_default()
          draw.text((256,256), "S", fill=(212,175,55,255), font=font, anchor="mm")
          splash.save(f"{d_path}/splash.png")
          print("Splash done")
          PY
      - name: Commit icons
        run: |
          git config user.name "BigWrapper"
          git config user.email "big@wrapper.com"
          git add -f android/app/src/main/res/
          git commit -m "Add all mipmap icons + drawable splash luxury"
          git push
