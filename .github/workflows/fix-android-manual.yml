name: Fix Android Manual
on: workflow_dispatch
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create real folders
        run: |
          rm -rf android
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:allowBackup="false" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:label="SIM WORTH" android:theme="@style/AppTheme.NoActionBarLaunch">
                  <activity android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode" android:name=".MainActivity" android:label="SIM WORTH" android:theme="@style/AppTheme.NoActionBarLaunch" android:launchMode="singleTask" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
                  <provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths"></meta-data></provider>
              </application>
              <uses-permission android:name="android.permission.INTERNET"/>
          </manifest>
          EOF

          cat > android/app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">SIM WORTH</string><string name="title_activity_main">SIM WORTH</string><string name="package_name">com.simworth.app</string><string name="custom_url_scheme">com.simworth.app</string></resources>
          EOF

          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen"><item name="windowNoTitle">true</item><item name="android:background">#000000</item></style></resources>
          EOF

          cat > android/app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?><paths><external-path name="external_files" path="."/></paths>
          EOF

          cat > android/variables.gradle <<'EOF'
          ext {
              minSdkVersion = 22
              compileSdkVersion = 34
              targetSdkVersion = 34
              androidxAppCompatVersion = '1.6.1'
              androidxJunitVersion = '1.1.5'
              androidxEspressoCoreVersion = '3.5.1'
              androidxCoreVersion = '1.10.1'
              junitVersion = '4.13.2'
              androidxMaterialVersion = '1.11.0'
              androidxBrowserVersion = '1.8.0'
              androidxLocalBroadcastManagerVersion = '1.1.0'
              firebaseMessagingVersion = '23.4.0'
              firebaseAnalyticsVersion = '21.5.0'
              playServicesLocationVersion = '21.2.0'
              exoplayerVersion = '2.19.1'
              androidxSplashScreenVersion = '1.0.1'
              androidxWebkitVersion = '1.9.0'
              androidxFragmentVersion = '1.6.2'
              coreSplashScreenVersion = '1.0.1'
          }
          EOF

          ls -R android

      - name: Commit
        run: |
          git config user.name "BigWrapper"
          git config user.email "big@wrapper.com"
          git add -f android/
          git commit -m "Manually fix android folders - no slash bug"
          git push
