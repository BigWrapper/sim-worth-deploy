name: Full Rebuild Android
on: workflow_dispatch
jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Clean and rebuild
        run: |
          npm install
          rm -rf android
          npx cap add android
          npx cap sync android
          ls -R android | head -n 100
      - name: Commit full android
        run: |
          git config user.name "BigWrapper"
          git config user.email "big@wrapper.com"
          git add -f android/
          git commit -m "Full android rebuild with Gradle - fixes kotlin error"
          git push
