name: Full Rebuild Android
on: workflow_dispatch
jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Clean and rebuild
        run: |
          npm install
          npm install -D @capacitor/cli
          npm install @capacitor/core @capacitor/android
          
          # Create dummy web folder if Next build fails
          mkdir -p out
          echo "<h1>SIM WORTH</h1>" > out/index.html
          
          rm -rf android
          npx cap add android
          npx cap sync android
          
          ls android/
          ls android/app/src/main/res/ | head -20
          
      - name: Commit
        run: |
          git config user.name "BigWrapper"
          git config user.email "big@wrapper.com"
          git add -f android/
          git commit -m "Full rebuild with capacitor cli installed"
          git push
