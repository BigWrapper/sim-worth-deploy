name: Rebuild Android
on: workflow_dispatch
jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: |
          git config user.name "BigWrapper"
          git config user.email "big@wrapper.com"
          git add -f android/
          git status
          git commit -m "Rebuild android folder correctly - force" || echo "nothing"
          git push
