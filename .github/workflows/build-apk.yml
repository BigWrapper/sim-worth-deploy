name: Build APK - Sim Worth Luxury
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Clean
        run: rm -rf android out .next

      - name: Install
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets --save-dev

      - name: Fix next.config
        run: |
          cat > next.config.mjs << 'EOF'
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            output: 'export',
            images: { unoptimized: true },
            eslint: { ignoreDuringBuilds: true },
            typescript: { ignoreBuildErrors: true },
          };
          export default nextConfig;
          EOF
          cat next.config.mjs

      - name: Build Web
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-key
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: dummy-key

      - name: Capacitor Setup
        run: |
          npx cap init "SIM Worth" com.bigwrapper.simworth --web-dir=out || true
          npx cap add android || true
          npx cap copy android

      - name: Generate Icons - FIXED LUXURY
        run: |
          if [ ! -f assets/icon.png ]; then echo "ERROR: assets/icon.png MISSING! Upload it!"; exit 1; fi
          npx capacitor-assets generate --android --iconBackgroundColor "#000000" --splashBackgroundColor "#000000" || true
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-${d}
            cp -f assets/icon.png android/app/src/main/res/mipmap-${d}/ic_launcher.png
            cp -f assets/icon.png android/app/src/main/res/mipmap-${d}/ic_launcher_round.png
          done
          mkdir -p android/app/src/main/res/drawable
          cp -f assets/icon.png android/app/src/main/res/drawable/splash.png
          ls -lh android/app/src/main/res/mipmap-xxxhdpi/

      - name: Fix Kotlin Version
        run: |
          sed -i "s/kotlinVersion = '.*'/kotlinVersion = '1.8.22'/" android/variables.gradle || true
          echo "configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'; exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'; resolutionStrategy { force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'; force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'; force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22' } }" >> android/app/build.gradle
          cat android/variables.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sim-Worth-APK-Luxury
          path: android/app/build/outputs/apk/debug/app-debug.apk
