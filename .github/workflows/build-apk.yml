name: Build APK - SIM Worth Luxury

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Web
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Capacitor Sync
        run: |
          npm install -D @capacitor/cli @capacitor/core @capacitor/android
          npx cap sync android
          ls -la out || ls -la .next
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Fix Icon and Splash - Copy from public (EASY METHOD)
        run: |
          echo "=== INJECTING CUSTOM ICON AND SPLASH ==="
          mkdir -p android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi android/app/src/main/res/drawable
          if [ -f public/icon.png ]; then
            echo "Found public/icon.png - Copying to all mipmap..."
            cp public/icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp public/icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp public/icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp public/icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp public/icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp public/icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            cp public/icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
            cp public/icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
            cp public/icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            cp public/icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
            echo "✅ Icons injected!"
          else
            echo "⚠️ WARNING: public/icon.png NOT FOUND - Add it!"
          fi
          if [ -f public/splash.png ]; then
            echo "Found public/splash.png - Copying..."
            cp public/splash.png android/app/src/main/res/drawable/splash.png
            echo "✅ Splash injected!"
          else
            echo "⚠️ No public/splash.png - splash will be default"
          fi
          ls -lh android/app/src/main/res/mipmap-xxxhdpi/

      - name: Build APK
        run: |
          if [ ! -f android/gradlew ]; then
            rm -rf android
            npx cap add android
          fi
          npx cap sync android
          # Fix kotlin duplicate bug
          sed -i "s/kotlin_version = .*/kotlin_version = '1.8.22'/" android/variables.gradle
          echo "
          configurations.all {
            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }" >> android/app/build.gradle
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SIM-Worth-Luxury-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
