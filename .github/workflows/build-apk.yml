name: Build APK - SIM Worth Luxury

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Web
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Build APK
        run: |
          npm install -D @capacitor/cli @capacitor/core @capacitor/android
          if [ ! -f android/gradlew ]; then
            rm -rf android
            npx cap add android
          fi
          npx cap sync android

          # ===== FORCE USE LEGACY ICON + COMPRESS =====
          echo "=== FORCING CUSTOM ICON ==="
          # DELETE adaptive icon folder that overrides png!
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          echo "Deleted mipmap-anydpi-v26 - Now Android MUST use png!"

          if [ -f public/icon.png ]; then
            echo "Copying icon..."
            for dir in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              cp public/icon.png android/app/src/main/res/$dir/ic_launcher.png
              cp public/icon.png android/app/src/main/res/$dir/ic_launcher_round.png
            done
            echo "✅ Icon forced!"
          fi

          if [ -f public/splash.png ]; then
            echo "Copying splash..."
            mkdir -p android/app/src/main/res/drawable-nodpi
            cp public/splash.png android/app/src/main/res/drawable/splash.png
            cp public/splash.png android/app/src/main/res/drawable-nodpi/splash.png
            echo "✅ Splash done!"
          fi

          ls -lh android/app/src/main/res/mipmap-xxxhdpi/
          
          sed -i "s/kotlin_version = .*/kotlin_version = '1.8.22'/" android/variables.gradle
          echo "
          configurations.all {
            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }" >> android/app/build.gradle
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SIM-Worth-Luxury-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
