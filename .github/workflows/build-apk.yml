name: Build APK - SIM Worth Luxury

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web - ONLINE
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Capacitor Setup
        run: |
          npm install -D @capacitor/cli @capacitor/core @capacitor/android @capacitor/assets
          echo '{"appId":"com.bigwrapper.simworth","appName":"SIM Worth","webDir":"out","bundledWebRuntime":false}' > capacitor.config.json
          cat capacitor.config.json
          npx cap add android
          npx cap sync android
          ls -la android/
          ls -la android/app/src/main/res/mipmap-hdpi/ || true

      - name: Generate Icons - FIXED
        run: |
          echo "=== ASSETS CHECK ==="
          ls -la assets/ || echo "NO assets folder!"
          ls -lh assets/icon.png || echo "icon.png NOT FOUND"
          
          if [ ! -f assets/icon.png ]; then
            echo "ERROR: assets/icon.png missing! Please upload it"
            exit 1
          fi
          
          # Generate with capacitor-assets
          npm install -D @capacitor/assets || true
          npx capacitor-assets generate --iconBackgroundColor "#000000" --splashBackgroundColor "#000000" --android || true
          
          echo "=== FORCE COPY ICONS ==="
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/res/drawable
          
          cp -f assets/icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp -f assets/icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp -f assets/icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp -f assets/icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp -f assets/icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          
          cp -f assets/icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp -f assets/icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp -f assets/icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp -f assets/icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp -f assets/icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          
          cp -f assets/splash.png android/app/src/main/res/drawable/splash.png || cp -f assets/icon.png android/app/src/main/res/drawable/splash.png
          
          echo "Icons copied OK"
          ls -lh android/app/src/main/res/mipmap-hdpi/ic_launcher.png

      - name: Patch Kotlin Version
        run: |
          sed -i 's/kotlinVersion = ".*"/kotlinVersion = "1.8.22"/' android/variables.gradle || true
          cat android/variables.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SIM-Worth-Luxury-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
