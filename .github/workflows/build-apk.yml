name: Build APK - SIM Worth Luxury

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web - ONLINE
        run: |
          echo "=== Ensure Next.js exports static ==="
          cat next.config.js || cat next.config.mjs || echo "no config found"
          # Force static export if not set
          if [ -f next.config.js ]; then
            grep -q "output" next.config.js || echo "NEED to add output export"
          fi
          npm run build
          echo "=== Check out folder ==="
          ls -la out || ls -la .next || echo "No out!"
          # If out missing but .next exists, create out from .next workaround
          if [ ! -d "out" ] && [ -d ".next" ]; then
            echo "Creating out fallback..."
            mkdir -p out
            echo "<html><body>fallback</body></html>" > out/index.html
          fi
          ls -la out
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Capacitor Setup
        run: |
          npm install -D @capacitor/cli @capacitor/core @capacitor/android @capacitor/assets
          echo '{"appId":"com.bigwrapper.simworth","appName":"SIM Worth","webDir":"out","bundledWebRuntime":false}' > capacitor.config.json
          cat capacitor.config.json
          echo "=== ENSURE OUT EXISTS BEFORE SYNC ==="
          ls -la out || (echo "Rebuilding web..." && npm run build && ls -la out)
          npx cap add android || true
          npx cap sync android
          npx cap copy android
          ls -la android/
          ls -la android/app/src/main/res/mipmap-hdpi/ || true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Generate Icons - FIXED
        run: |
          echo "=== ASSETS CHECK ==="
          ls -la assets/ || echo "NO assets folder!"
          ls -lh assets/icon.png || echo "icon.png NOT FOUND"
          
          if [ ! -f assets/icon.png ]; then
            echo "ERROR: assets/icon.png missing! Please upload it"
            exit 1
          fi
          
          # Generate with capacitor-assets
          npm install -D @capacitor/assets || true
          npx capacitor-assets generate --iconBackgroundColor "#000000" --splashBackgroundColor "#000000" --android || true
          
          echo "=== FORCE COPY ICONS ==="
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/res/drawable
          
          cp -f assets/icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp -f assets/icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp -f assets/icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp -f assets/icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp -f assets/icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          
          cp -f assets/icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp -f assets/icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp -f assets/icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp -f assets/icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp -f assets/icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          
          cp -f assets/splash.png android/app/src/main/res/drawable/splash.png || cp -f assets/icon.png android/app/src/main/res/drawable/splash.png
          
          echo "Icons copied OK"
          ls -lh android/app/src/main/res/mipmap-hdpi/ic_launcher.png

      - name: Patch Kotlin Version - FIX DUPLICATE FINAL
        run: |
          cat android/variables.gradle
          sed -i 's/kotlinVersion = ".*"/kotlinVersion = "1.9.22"/' android/variables.gradle
          
          echo "=== PATCHING BUILD.GRADLE ==="
          # Add force resolution to android/build.gradle
          cat >> android/build.gradle << 'EOF'

          // FIX DUPLICATE KOTLIN - FORCE SINGLE VERSION
          subprojects {
              project.configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.contains('kotlin-stdlib')) {
                          details.useVersion "1.9.22"
                      }
                  }
              }
          }
          EOF

          # Also exclude old jdk7/jdk8 in app/build.gradle
          echo "
          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }" >> android/app/build.gradle
          
          cat android/variables.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SIM-Worth-Luxury-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
