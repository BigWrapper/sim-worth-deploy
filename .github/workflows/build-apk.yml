name: Build APK - Sim Worth

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Clean Old Android
        run: |
          rm -rf android
          rm -rf out
          rm -rf .next
          rm -rf node_modules/.cache

      - name: Install
        run: npm install

      - name: Fix next.config for APK
        run: |
          echo "const nextConfig = { output: 'export', images: { unoptimized: true }, eslint: { ignoreDuringBuilds: true }, typescript: { ignoreBuildErrors: true } }; export default nextConfig;" > next.config.mjs

      - name: Build Web
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-key-for-build-only
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: dummy-key-for-build-only

      - name: Capacitor Fresh Setup
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Sim Worth" com.bigwrapper.simworth --web-dir=out || true
          npx cap add android
          npx cap copy android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sim-Worth-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
