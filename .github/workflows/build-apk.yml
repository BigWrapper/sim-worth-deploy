name: Build APK - Sim Worth Luxury

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }

      - name: Clean
        run: rm -rf android out .next

      - name: Install
        run: |
          npm install
          npm install @capacitor/assets --save-dev

      - name: Fix next.config
        run: |
          echo "const nextConfig = { output: 'export', images: { unoptimized: true }, eslint: { ignoreDuringBuilds: true }, typescript: { ignoreBuildErrors: true } }; export default nextConfig;" > next.config.mjs

      - name: Build Web
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-key
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: dummy-key

      - name: Capacitor Setup
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "SIM Banc" com.bigwrapper.simbanc --web-dir=out || true
          npx cap add android

      - name: Generate Icons & Splash
        run: |
          mkdir -p assets
          if [ -f assets/icon.png ]; then
            echo "Generating icons from assets/icon.png"
            npx capacitor-assets generate --android --iconBackgroundColor "#000000" --splashBackgroundColor "#000000"
          else
            echo "No custom icon found, using default"
          fi

      - name: Copy & Build APK
        run: |
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sim-Worth-APK-Luxury
          path: android/app/build/outputs/apk/debug/app-debug.apk
